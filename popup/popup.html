<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="24" height="24">
    <h1>LexAnon</h1>
  </header>

  <!-- Connected state -->
  <section id="view-connected" hidden>
    <div class="status-row">
      <span class="dot" id="server-dot"></span>
      <span id="server-status">Checking server…</span>
    </div>
    <div class="status-row">
      <span class="dot" id="llm-dot"></span>
      <span id="llm-status">Checking LLM…</span>
    </div>
    <button id="open-app" class="primary">Open LexAnon</button>
    <button id="unpair" class="link">Disconnect from this server</button>
  </section>

  <!-- Pairing state -->
  <section id="view-pair" hidden>
    <p class="muted">Connect to your firm's LexAnon server. Ask your
      administrator for the server address and a pairing code.</p>
    <label>Server address
      <input id="server-url" type="text" placeholder="https://192.168.1.10:8090" autocomplete="off">
    </label>
    <label>Pairing code
      <input id="pair-code" type="text" placeholder="8-digit code" autocomplete="off" inputmode="numeric">
    </label>
    <label>This computer's name
      <input id="client-name" type="text" placeholder="e.g. Dan's laptop" autocomplete="off">
    </label>
    <button id="pair-btn" class="primary">Pair</button>
    <div id="pair-error" class="error" hidden></div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
