<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="24" height="24">
    <h1>LexAnon</h1>
  </header>

  <!-- Connected state -->
  <section id="view-connected" hidden>
    <div class="status-row">
      <span class="dot" id="server-dot"></span>
      <span id="server-status">Checking server…</span>
    </div>
    <div class="status-row">
      <span class="dot" id="llm-dot"></span>
      <span id="llm-status">Checking LLM…</span>
    </div>
    <label class="toggle-row">
      <input type="checkbox" id="intercept-toggle">
      Offer to anonymize files uploaded to AI chat sites
    </label>
    <button id="open-app" class="primary">Open LexAnon</button>
    <button id="unpair" class="link">Disconnect from this server</button>
  </section>

  <!-- Not paired: setup happens in a full tab, because Chrome closes this
       popup whenever it loses focus (e.g. during the permission prompt). -->
  <section id="view-pair" hidden>
    <p class="muted">Not connected to a LexAnon server yet.</p>
    <button id="open-setup" class="primary">Set up connection</button>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
